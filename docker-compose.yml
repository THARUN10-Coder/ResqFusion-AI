version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: resqfusion-db
    environment:
      POSTGRES_DB: resqfusion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resqfusion-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/resqfusion
      AI_PROVIDER: mock
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resqfusion-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
